services:
  - type: web
    name: lazymorning
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENABLE_SCHEDULE
        value: "true"
      - key: BRIEFING_TIME
        value: "06:30"
      - key: TIMEZONE
        value: "Asia/Kolkata"
